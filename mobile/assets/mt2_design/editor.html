<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر صوت يجمعنا</title><link rel="stylesheet" href="styles.css"><style>body.editor{background:#08031b}.editorbar{position:sticky;top:0;z-index:99;background:#0e0725ee;border-bottom:1px solid #6f3bff;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}.editorbar .actions{display:flex;gap:8px;flex-wrap:wrap}.edbtn{border:1px solid #8052ff;background:#170b3d;color:#fff;border-radius:12px;padding:9px 13px;cursor:pointer}.edbtn.primary{background:linear-gradient(135deg,#8d39ff,#4f16e8)}.editor-layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 64px)}.panel{border-left:1px solid #43206f;background:#0b0620;padding:16px;overflow:auto}.control{margin:10px 0}.control label{display:block;font-size:12px;color:#cfc4ee;margin-bottom:5px}.control input,.control textarea{width:100%;box-sizing:border-box;background:#130b2c;color:#fff;border:1px solid #54308b;border-radius:9px;padding:9px}.screen-list button{width:100%;text-align:right;margin:4px 0}.stage{display:flex;justify-content:center;align-items:flex-start;padding:28px;overflow:auto}.phone{width:390px;min-height:820px;border:1px solid #8a58ff;border-radius:34px;overflow:hidden;background:#07051b}.phone .screen{min-height:820px}.hint{font-size:11px;color:#a99ac9;line-height:1.7}@media(max-width:850px){.editor-layout{grid-template-columns:1fr}.panel{order:2;border-left:0;border-top:1px solid #43206f}.stage{order:1;padding:12px}.phone{transform:scale(.88);transform-origin:top center;margin-bottom:-90px}}</style></head><body class="editor"><header class="editorbar"><strong>محرر التصميم — صوت يجمعنا</strong><div class="actions"><button class="edbtn" onclick="location.href='index.html'">عرض التطبيق</button><button class="edbtn" onclick="resetAll()">إعادة ضبط</button><button class="edbtn primary" onclick="downloadProject()">تصدير الإعدادات</button></div></header><main class="editor-layout"><aside class="panel"><h3>الشاشات</h3><div id="screenList" class="screen-list"></div><h3>خصائص العنصر</h3><div id="controls"><p class="hint">اختر عنصراً من المعاينة.</p></div></aside><section class="stage"><div class="phone" id="phone"></div></section></main><script src="app.js"></script><script src="editor.js"></script></body></html>
