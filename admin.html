<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فرعون بارتي — لوحة التحكم</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login-shell">
  <div class="login-card">
    <div class="crown">♛</div>
    <h1>فرعون بارتي</h1>
    <p>لوحة الإدارة والتحكم الكامل</p>
    <input id="password" type="password" placeholder="كلمة مرور لوحة التحكم" autocomplete="current-password">
    <button id="loginBtn" class="primary">دخول آمن</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><span>♛</span><div><b>فرعون بارتي</b><small>CONTROL CENTER</small></div></div>
    <nav id="nav">
      <button data-page="dashboard" class="active">◈ <span>الرئيسية</span></button>
      <button data-page="users">♟ <span>المستخدمون</span><em id="usersBadge">0</em></button>
      <button data-page="rooms">⌂ <span>الغرف</span><em id="roomsBadge">0</em></button>
      <button data-page="agencies">♜ <span>الوكالات</span></button>
      <button data-page="gifts">🎁 <span>الهدايا</span></button>
      <button data-page="topups">◆ <span>الشحن</span><em id="topupsBadge">0</em></button>
      <button data-page="reports">⚑ <span>البلاغات</span><em id="reportsBadge">0</em></button>
      <button data-page="bans">⛔ <span>الحظر</span></button>
      <button data-page="settings">⚙ <span>الإعدادات</span></button>
    </nav>
    <button id="logout" class="logout">↪ تسجيل الخروج</button>
  </aside>
  <main class="main">
    <header class="topbar"><div><h2 id="pageTitle">الرئيسية</h2><span id="status">متصل بقاعدة البيانات</span></div><button id="refresh" class="ghost">↻ تحديث</button></header>
    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script src="admin.js"></script>
</body>
</html>
