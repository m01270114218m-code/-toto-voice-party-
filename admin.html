<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070812">
<title>فرعون بارتي | مركز التحكم</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">♛</div>
    <div class="eyebrow">PHARAOH PARTY</div>
    <h1>مركز التحكم</h1>
    <p>إدارة التطبيق والبيانات الحقيقية</p>
    <form id="loginForm">
      <input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور الإدارة" required>
      <button id="loginBtn" class="btn primary wide" type="submit">دخول إلى اللوحة</button>
    </form>
    <div id="loginMsg" class="message"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span>♛</span><div><strong>فرعون بارتي</strong><small>CONTROL CENTER</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">⌂<span>الرئيسية</span></button>
      <button class="nav-item" data-page="users">♟<span>المستخدمون</span><b id="usersBadge">0</b></button>
      <button class="nav-item" data-page="rooms">◈<span>الغرف</span><b id="roomsBadge">0</b></button>
      <button class="nav-item" data-page="agencies">♜<span>الوكالات</span></button>
      <button class="nav-item" data-page="gifts">🎁<span>الهدايا</span></button>
      <button class="nav-item" data-page="vip">👑<span>VIP</span></button>
      <button class="nav-item" data-page="topups">◆<span>الشحن</span><b id="topupsBadge">0</b></button>
      <button class="nav-item" data-page="reports">⚑<span>البلاغات</span><b id="reportsBadge">0</b></button>
      <button class="nav-item" data-page="bans">⛔<span>الحظر</span></button>
      <button class="nav-item" data-page="settings">⚙<span>الإعدادات</span></button>
    </nav>
    <button id="logout" class="logout">↪ تسجيل الخروج</button>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h2 id="pageTitle">الرئيسية</h2><div id="connection"><i></i> متصل بقاعدة البيانات</div></div>
      <div class="top-actions"><button id="refresh" class="btn ghost">↻ تحديث</button></div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button id="closeModal" class="modal-close" aria-label="إغلاق" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
window.__ADMIN_API="https://hgsfdkopbbwbtvsrbpoi.supabase.co/functions/v1/admin-control";
window.__ADMIN_KEY="sb_publishable_-4jjp6J2GLVPkv8AW95TZQ_DLOEIWOm";
document.getElementById("loginForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const msg=document.getElementById("loginMsg"),btn=document.getElementById("loginBtn");
 btn.disabled=true;msg.textContent="جارٍ التحقق...";
 try{
  const r=await fetch(window.__ADMIN_API,{method:"POST",headers:{"Content-Type":"application/json","apikey":window.__ADMIN_KEY},body:JSON.stringify({action:"login",password:document.getElementById("password").value})});
  const j=await r.json().catch(()=>({error:"الخادم أعاد استجابة غير صالحة"}));
  if(!r.ok||!j.token)throw new Error(j.error||"فشل تسجيل الدخول");
  sessionStorage.setItem("pharaoh_admin_token",j.token);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  if(typeof window.loadDashboard==="function") await window.loadDashboard();
 }catch(err){msg.textContent=err.message||"تعذر الاتصال بالخادم";}finally{btn.disabled=false}
});
</script>
<script src="admin.js?v=20260925-02"></script>
</body>
</html>
