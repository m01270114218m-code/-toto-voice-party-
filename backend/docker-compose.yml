services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voiceroom
      POSTGRES_USER: voiceroom
      POSTGRES_PASSWORD: voiceroom
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U voiceroom -d voiceroom"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  pgdata:
