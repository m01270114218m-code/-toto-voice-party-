name: Build TOYO Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        run: flutter create --platforms=android --project-name toyo_voice_party --org com.toyo .

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
            grep -nE 'compileSdk|targetSdk' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
            grep -nE 'compileSdk|targetSdk' android/app/build.gradle
          else
            echo "Android Gradle project was not generated"
            exit 1
          fi

      - name: Clean generated project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p build/verified
          cp "$APK" build/verified/TOYO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOYO-Android-APK
          path: mobile/build/verified/TOYO.apk
          if-no-files-found: error
