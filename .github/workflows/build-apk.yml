name: Build MT2 Voice Party APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the standard Android platform files for this clean Flutter source tree.
      - name: Bootstrap Flutter Android platform
        working-directory: mobile
        run: flutter create --platforms=android --project-name=mt2_voice_party .

      - name: Configure Android permissions
        working-directory: mobile
        run: bash tool/configure_android.sh

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: MT2-Voice-Party-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
