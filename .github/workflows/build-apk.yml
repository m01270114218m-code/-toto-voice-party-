name: Build TOYO Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name toyo_voice_party .

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text()
              s = re.sub(r'compileSdk(?:Version)?\\s*(?:=\\s*)?[^\\n]+', 'compileSdk = 36', s)
              s = re.sub(r'targetSdk(?:Version)?\\s*(?:=\\s*)?[^\\n]+', 'targetSdk = 36', s)
              p.write_text(s)
          PY
          grep -R "compileSdk" android/app || true

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/verified
          cp build/app/outputs/flutter-apk/app-release.apk build/verified/TOYO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOYO-Android-APK
          path: mobile/build/verified/TOYO.apk
          if-no-files-found: error
