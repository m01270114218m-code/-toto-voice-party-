name: Build New Royal Voice Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build NEW Royal Voice template release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout NEW template
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify NEW template files
        working-directory: mobile
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "RoyalVoiceApp" lib/main.dart
          grep -q "الغرفة الملكية" lib/main.dart

      - name: Get Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Create Android project if missing
        working-directory: mobile
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android .
          fi

      - name: Build NEW template release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify NEW template APK
        run: |
          test -s mobile/build/app/outputs/flutter-apk/app-release.apk
          ls -lh mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload NEW template APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRoom-Royal-NEW-TEMPLATE-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
