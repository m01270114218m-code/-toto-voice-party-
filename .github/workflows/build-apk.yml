name: Build TOYO Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Create Android platform
        working-directory: mobile
        run: |
          flutter create --platforms=android .
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('android/app/build.gradle.kts'),Path('android/app/build.gradle')]:
              if not p.exists():
                  continue
              s=p.read_text()
              s=re.sub(r'compileSdk\\s*=\\s*[^\\n]+', 'compileSdk = 36', s)
              s=re.sub(r'compileSdkVersion\\s+[^\\n]+', 'compileSdkVersion 36', s)
              s=re.sub(r'targetSdk\\s*=\\s*[^\\n]+', 'targetSdk = 36', s)
              s=re.sub(r'targetSdkVersion\\s+[^\\n]+', 'targetSdkVersion 36', s)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>'''
          if marker in s and 'android.permission.RECORD_AUDIO' not in s:
              p.write_text(s.replace(marker,perms,1))
          PY
      - name: Force all Android subprojects to compile with SDK 36
        working-directory: mobile
        run: |
          cat >> android/build.gradle <<'GRADLE'
          subprojects {
            afterEvaluate { project ->
              def android = project.extensions.findByName("android")
              if (android != null) {
                try { android.compileSdkVersion 36 } catch (ignored) {}
              }
            }
          }
          GRADLE
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Align Agora Android compile SDK
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path.home()/'.pub-cache/hosted/pub.dev'
          for p in root.glob('agora_rtc_engine-*/android/build.gradle*'):
              s=p.read_text()
              s=re.sub(r'compileSdkVersion\\s+\\d+', 'compileSdkVersion 36', s)
              s=re.sub(r'compileSdk\\s*=\\s*\\d+', 'compileSdk = 36', s)
              p.write_text(s)
              print('patched',p)
          PY
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOYO-Voice-Party-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
