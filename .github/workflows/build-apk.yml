name: Build Taj Live APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name taj_live --org com.tajlive .
      - name: Remove generated starter test
        run: rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/verified
          cp build/app/outputs/flutter-apk/app-release.apk build/verified/taj-live.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Taj-Live-Android-APK
          path: mobile/build/verified/taj-live.apk
          if-no-files-found: error
