name: Build New Royal Flutter APK v2
on:
  workflow_dispatch:
  push:
    branches: [new-voice-template]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Create Android host
        working-directory: mobile
        run: flutter create --platforms=android --project-name voice_room_royal .
      - name: Get packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRoom-Royal-release-apk-v2
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
