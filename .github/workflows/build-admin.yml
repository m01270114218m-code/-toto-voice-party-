name: Build TOYO Admin
on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/**'
      - '.github/workflows/build-admin.yml'
jobs:
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package.json
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: TOYO-admin-dashboard
          path: admin/dist
